name: DB maintenance

on:
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the SUPABASE_DB_URL secret (Supabase > Connect > Session pooler connection string) and run again."
            exit 1
          fi

      - name: Install psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Drop unused indexes and rebuild production_maps
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash db/maintenance.sh
