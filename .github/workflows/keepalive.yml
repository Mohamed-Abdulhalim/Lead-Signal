name: Keepalive

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows so GitHub does not pause them after 60 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in scrape.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "enabled $wf"
          done
